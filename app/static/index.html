<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LLM Eval Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f172a; --panel: #1e293b; --border: #334155;
      --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      padding: 24px; max-width: 1400px; margin: 0 auto;
    }
    h1 { margin: 0 0 4px; font-size: 24px; }
    h2 { margin: 0 0 16px; font-size: 16px; font-weight: 500; color: var(--muted); }
    header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 24px; }
    button {
      background: var(--accent); color: #0f172a; border: 0; padding: 8px 16px;
      border-radius: 6px; font-weight: 600; cursor: pointer;
    }
    button:hover { opacity: 0.85; }

    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 16px;
    }
    .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
    .card .value { font-size: 26px; font-weight: 700; margin-top: 6px; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    .panel {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 10px; padding: 16px;
    }

    .ab-controls { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
    .ab-controls select, .ab-controls input {
      background: #0f172a; color: var(--text); border: 1px solid var(--border);
      padding: 6px 10px; border-radius: 6px;
    }

    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; font-size: 13px; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .winner { color: #4ade80; font-weight: 600; }
    .loser  { color: #f87171; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>LLM Eval Dashboard</h1>
      <h2 id="subtitle">Loading…</h2>
    </div>
    <button onclick="refresh()">Refresh</button>
  </header>

  <section class="cards">
    <div class="card"><div class="label">Total calls</div><div class="value" id="stat-calls">–</div></div>
    <div class="card"><div class="label">Total cost</div><div class="value" id="stat-cost">–</div></div>
    <div class="card"><div class="label">Avg latency</div><div class="value" id="stat-latency">–</div></div>
    <div class="card"><div class="label">Total tokens</div><div class="value" id="stat-tokens">–</div></div>
  </section>

  <section class="grid-2">
    <div class="panel">
      <h2>Score over time — <select id="ts-scorer"></select></h2>
      <canvas id="chart-timeseries" height="120"></canvas>
    </div>
    <div class="panel">
      <h2>Score distribution — <select id="dist-scorer"></select></h2>
      <canvas id="chart-distribution" height="120"></canvas>
    </div>
  </section>

  <section class="panel">
    <h2>A/B Comparison</h2>
    <div class="ab-controls">
      <label>Prompt A: <input id="p1" value="greeting_v1"></label>
      <label>Prompt B: <input id="p2" value="greeting_v2"></label>
      <button onclick="loadAB()">Compare</button>
    </div>
    <table id="ab-table">
      <thead>
        <tr><th>Metric</th><th>Prompt A</th><th>Prompt B</th><th>Δ (B − A)</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <script src="/static/dashboard.js"></script>
</body>
</html>
